version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # Only minor/patch are grouped. Majors arrive as individual PRs so each
      # migration can be reviewed and landed on its own - grouping them produced
      # one PR bundling Gradle 8->9, Groovy 3->4, JUnit 5->6 and
      # json-schema-validator 1->3, which could not be landed.
      gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels: ["dependencies", "gradle"]
    ignore:
      # json-schema-validator 2.x/3.x rewrote the public API (JsonSchemaFactory
      # builders, SchemaValidatorsConfig, ValidationMessage). PR #37 attempted
      # 1.4.0 -> 3.0.7 and failed `test (17)` and `bench`. The migration is not
      # worth the churn while 1.4.x carries no known advisories. Minor and patch
      # updates within 1.x still flow normally.
      - dependency-name: "com.networknt:json-schema-validator"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels: ["dependencies", "actions"]
