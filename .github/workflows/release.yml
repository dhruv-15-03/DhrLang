name: Release

on:
  push:
    # Match JVM version tags (v1.2.3) only — not vscode-v* / other prefixed tags
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  checks: write   # Needed for dorny/test-reporter to create check run

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Setup Python for the optional offline evidence tool
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify offline evidence tooling
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tools/learning -p 'test_*.py' -v
        
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        
      - name: Get version
        id: get_version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          RAW="${DISPATCH_VERSION:-$GITHUB_REF_NAME}"
          if [[ ! "$RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an existing compiler release tag (vMAJOR.MINOR.PATCH), got $RAW" >&2
            exit 1
          fi
          CLEAN=${RAW#v}
          SHA=$(git rev-parse "$RAW^{commit}")
          test "$SHA" = "$(git rev-parse HEAD)"
          echo "RELEASE_COMMIT=$SHA" >> "$GITHUB_ENV"
          echo "RAW_TAG=$RAW" >> $GITHUB_OUTPUT
          echo "VERSION=$CLEAN" >> $GITHUB_OUTPUT
          ./gradlew verifyReleaseConsistency "-PreleaseVersion=$CLEAN"

      - name: Refuse to replace an existing release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.get_version.outputs.RAW_TAG }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.RELEASE_TAG
              });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            core.setFailed("This release already exists. Publish a new version instead of replacing its artifacts.");
          
      - name: Build and verify compiler and distributions
        run: ./gradlew clean check stageCompiler distZip distTar
        
      - name: Generate test report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: DhrLang Tests
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false
          
      - name: Package and verify the canonical VSIX
        working-directory: vscode-extension
        run: |
          npm ci --no-audit --no-fund
          npm run test:packaging
          npm run package

      - name: Prepare documentation and examples
        run: |
          set -o pipefail
          cp README.md LICENSE CHANGELOG.md GETTING_STARTED.md INSTALL.md TUTORIALS.md EXAMPLES.md \
            HOST_EXECUTION.md PROJECTS.md LEARNING.md ENTERPRISE_LAB.md RELEASE_CHECKLIST.md host-request.schema.json host-response.schema.json project.schema.json build/release/
          mkdir -p build/release/examples
          cp -R input/. build/release/examples/
          mkdir -p build/release/design
          cp design/compatibility-profiles.md design/learner-preview-gates.md \
            design/sap-read-only-integration.md design/release-support-contract.md build/release/design/
          mkdir -p build/release/tools/learning
          cp tools/learning/evidence.py tools/learning/test_evidence.py build/release/tools/learning/
          mkdir -p build/release/src/main/resources/dhrlang/learn
          cp src/main/resources/dhrlang/learn/exercises.json build/release/src/main/resources/dhrlang/learn/
          # Archive only tracked CAP sources, never local caches or credential files.
          git archive HEAD examples/cap-java-mock | tar -x -C build/release
          {
            echo "# DhrLang v${{ steps.get_version.outputs.VERSION }}"
            echo ""
            echo "Verified standalone compiler and self-contained VS Code extension."
            echo "Run: java -jar DhrLang.jar examples/sample.dhr"
            echo "Requires Java 17+. See CHANGELOG.md for changes and experimental feature limits."
          } > build/release/RELEASE_NOTES.md

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: dhrlang-jar
          path: build/release/DhrLang.jar
          retention-days: 2
          
      - name: Create release archives
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          tar -czf "build/distributions/DhrLang-$VERSION-linux.tar.gz" -C build/release .
          (cd build/release && zip -qr "../distributions/DhrLang-$VERSION-windows.zip" .)
          mkdir -p build/archive-smoke
          unzip -q "build/distributions/DhrLang-$VERSION-windows.zip" -d build/archive-smoke
          ./gradlew verifyCompilerArtifact -PcompilerJar=build/archive-smoke/DhrLang.jar
          cmp build/compiler/DhrLang.jar build/archive-smoke/DhrLang.jar
          tar -xOf "build/distributions/DhrLang-$VERSION-linux.tar.gz" ./DhrLang.jar | cmp build/compiler/DhrLang.jar -
          
      - name: Generate checksums
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p build/release-assets
          cp build/release/DhrLang.jar build/release/release-manifest.json \
            "build/release/dhrlang-vscode-$VERSION.vsix" \
            "build/distributions/DhrLang-$VERSION.zip" \
            "build/distributions/DhrLang-$VERSION-linux.tar.gz" \
            "build/distributions/DhrLang-$VERSION-windows.zip" build/release-assets/
          cd build/release-assets
          sha256sum DhrLang.jar release-manifest.json "dhrlang-vscode-$VERSION.vsix" \
            "DhrLang-$VERSION.zip" "DhrLang-$VERSION-linux.tar.gz" "DhrLang-$VERSION-windows.zip" > checksums.txt
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: DhrLang v${{ steps.get_version.outputs.VERSION }}
          body_path: build/release/RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            build/release-assets/DhrLang.jar
            build/release-assets/DhrLang-${{ steps.get_version.outputs.VERSION }}.zip
            build/release-assets/DhrLang-${{ steps.get_version.outputs.VERSION }}-linux.tar.gz
            build/release-assets/DhrLang-${{ steps.get_version.outputs.VERSION }}-windows.zip
            build/release-assets/checksums.txt
            build/release-assets/release-manifest.json
            build/release-assets/dhrlang-vscode-${{ steps.get_version.outputs.VERSION }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir build/downloaded \
            --pattern DhrLang.jar --pattern release-manifest.json --pattern "dhrlang-vscode-$VERSION.vsix"
          (cd vscode-extension && npm run verify:package -- ../build/downloaded)
          ./gradlew verifyCompilerArtifact -PcompilerJar=build/downloaded/DhrLang.jar
          
      - name: Publish to GitHub Packages
        run: ./gradlew publish --info --stacktrace
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  create-homebrew-formula:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Setup variables
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: dhrlang-jar
          path: .

      - name: Compute checksum
        run: |
          test -f DhrLang.jar || { echo 'DhrLang.jar missing'; ls -al; exit 1; }
          SHA256=$(sha256sum DhrLang.jar | cut -d' ' -f1)
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          
      - name: Create Homebrew formula PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            const formula = `class Dhrlang < Formula
              desc "DhrLang programming language (English-core tokens: num/duo/sab/kya/ek/kaam)"
              homepage "https://github.com/${{ github.repository }}"
              url "https://github.com/${{ github.repository }}/releases/download/v${{ steps.vars.outputs.VERSION }}/DhrLang.jar"
              sha256 "${{ env.SHA256 }}"
              license "MIT"
              version "${{ steps.vars.outputs.VERSION }}"

              depends_on "openjdk@17"

              def install
                libexec.install "DhrLang.jar"
                (bin/"dhrlang").write <<~EOS
                  #!/bin/bash
                  exec "#{Formula["openjdk@17"].opt_bin}/java" -jar "#{libexec}/DhrLang.jar" "$@"
                EOS
              end

              test do
                (testpath/"test.dhr").write <<~EOS
                  class Main {
                    static kaam main() {
                      printLine("Hello DhrLang!");
                    }
                  }
                EOS
                assert_match "Hello DhrLang!", shell_output("#{bin}/dhrlang #{testpath}/test.dhr")
              end
            end`;
            
            console.log('Homebrew formula would be:');
            console.log(formula);
            
            // In a real scenario, you would create a PR to homebrew-core or your own tap
            // For now, we just log the formula that would be created
            
  notify-release:
    needs: [build-and-release, create-homebrew-formula]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
      - name: Notify success
        if: needs.build-and-release.result == 'success'
        run: |
          echo "🎉 DhrLang ${{ steps.get_version.outputs.VERSION }} released successfully!"
          echo "📦 Assets available at: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.VERSION }}"
          echo "🚀 Ready for distribution!"
          
      - name: Notify failure
        if: needs.build-and-release.result == 'failure'
        run: |
          echo "❌ Release failed for DhrLang ${{ steps.get_version.outputs.VERSION }}"
          echo "Check the logs for details"
          # Do not force exit 1; overall workflow already marked failed