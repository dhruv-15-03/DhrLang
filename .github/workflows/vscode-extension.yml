name: VS Code Extension Release

on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing compiler release version (e.g., 4.0.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vscode-release
  cancel-in-progress: false

jobs:
  publish-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version and check publish credentials
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION="${DISPATCH_VERSION:-${GITHUB_REF_NAME#vscode-v}}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a compiler release version (MAJOR.MINOR.PATCH), got $VERSION" >&2
            exit 1
          fi
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is required; nothing has been published." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out the canonical compiler release
        uses: actions/checkout@v7
        with:
          ref: v${{ steps.version.outputs.VERSION }}
          fetch-depth: 0

      - name: Verify tag provenance
        id: provenance
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "Compiler and extension release tags must identify the same commit." >&2
            exit 1
          fi
          echo "RELEASE_COMMIT=$SHA" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install locked packaging tools
        working-directory: vscode-extension
        run: npm ci --no-audit --no-fund

      - name: Download the already-verified release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir build/downloaded \
            --pattern DhrLang.jar --pattern release-manifest.json --pattern "dhrlang-vscode-$VERSION.vsix"

      - name: Verify exact compiler and VSIX bytes before publishing
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x gradlew
          ./gradlew verifyReleaseConsistency verifyCompilerArtifact \
            "-PreleaseVersion=$VERSION" -PcompilerJar=build/downloaded/DhrLang.jar
          (cd vscode-extension && npm run verify:package -- ../build/downloaded)

      - name: Publish the same VSIX to the Marketplace
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: npx --no-install vsce publish --packagePath "../build/downloaded/dhrlang-vscode-$VERSION.vsix"

      - name: Confirm the version is visible on the Marketplace
        working-directory: vscode-extension
        run: node scripts/verify-marketplace.cjs

      - name: Create extension release after successful publication
        uses: softprops/action-gh-release@v3
        with:
          tag_name: vscode-v${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ steps.provenance.outputs.SHA }}
          name: DhrLang VS Code Extension v${{ steps.version.outputs.VERSION }}
          body: |
            The same verified VSIX is available here and on the VS Code Marketplace.
            It bundles the standalone compiler from DhrLang v${{ steps.version.outputs.VERSION }}.
            Java 17+ is required. See the compiler release changelog for capabilities and limitations.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            build/downloaded/dhrlang-vscode-${{ steps.version.outputs.VERSION }}.vsix
            build/downloaded/release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
