name: Bench & Coverage Badge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute
        run: chmod +x gradlew
      - name: Run tests + coverage + mutation + badges
        run: ./gradlew test jacocoTestReport generateCoverageBadge pitest generateMutationBadge --info --stacktrace
      - name: Run benchmarks
        run: ./gradlew bench benchCompare --info --stacktrace || echo "Bench compare failed (non-blocking in PR)"
      - name: Upload bench results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: build/bench/bench-results.json
          if-no-files-found: warn
      - name: Upload updated badges for maintainer review
        uses: actions/upload-artifact@v7
        with:
          name: quality-badges
          path: |
            docs/badges/coverage.svg
            docs/badges/mutation.svg
          if-no-files-found: error
