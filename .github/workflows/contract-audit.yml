name: Smart Contract Security Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'input/contracts/**'
      - 'src/main/java/dhrlang/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'input/contracts/**'
      - 'src/main/java/dhrlang/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # Required for SARIF upload to GitHub Security tab

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build compiler
        run: |
          chmod +x gradlew
          ./gradlew shadowJar -x test

      - name: Find contract files
        id: contracts
        run: |
          FILES=$(find input/contracts -name "*.dhr" 2>/dev/null | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Found contracts: $FILES"

      - name: Run security audit (text report)
        if: steps.contracts.outputs.files != ''
        run: |
          JAR=$(ls build/libs/DhrLang-*.jar | head -1)
          echo "═══════════════════════════════════════════════════"
          echo "  DhrLang Smart Contract Security Audit"
          echo "═══════════════════════════════════════════════════"
          for f in ${{ steps.contracts.outputs.files }}; do
            echo ""
            echo "── Auditing: $f ──"
            java -jar "$JAR" --audit "$f" || true
          done

      - name: Generate SARIF reports
        if: steps.contracts.outputs.files != ''
        run: |
          JAR=$(ls build/libs/DhrLang-*.jar | head -1)
          mkdir -p build/sarif
          for f in ${{ steps.contracts.outputs.files }}; do
            NAME=$(basename "$f" .dhr)
            # --audit is an analysis mode and exits 0 even when it reports findings.
            java -jar "$JAR" --audit --sarif --output=build/sarif "$f" >/dev/null || true
            # The CLI writes audit-report.sarif into --output; rename per-contract.
            if [ -f build/sarif/audit-report.sarif ]; then
              mv build/sarif/audit-report.sarif "build/sarif/${NAME}.sarif"
            fi
          done

      - name: Summarize findings
        if: steps.contracts.outputs.files != ''
        run: |
          {
            echo "## 🛡️ Smart Contract Security Audit"
            echo ""
            echo "| Contract | Findings |"
            echo "| --- | ---: |"
            TOTAL=0
            for s in build/sarif/*.sarif; do
              [ -f "$s" ] || continue
              NAME=$(basename "$s" .sarif)
              COUNT=$(grep -c '"ruleId"' "$s" || true)
              TOTAL=$((TOTAL + COUNT))
              echo "| \`$NAME\` | $COUNT |"
            done
            echo "| **Total** | **$TOTAL** |"
            echo ""
            echo "Results upload to **Security → Code scanning** (category \`dhrlang-security-audit\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to GitHub Security
        if: steps.contracts.outputs.files != '' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/sarif/
          category: dhrlang-security-audit
        # NOT continue-on-error: an invalid/rejected SARIF is a real bug we want to
        # surface loudly (it previously failed silently as JOB_STATUS_CONFIGURATION_ERROR).

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: build/sarif/
          retention-days: 30

  compile-evm:
    name: EVM Compilation Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build compiler
        run: |
          chmod +x gradlew
          ./gradlew shadowJar -x test

      - name: Compile contracts to EVM bytecode
        run: |
          JAR=$(ls build/libs/DhrLang-*.jar | head -1)
          mkdir -p build/evm
          for f in input/contracts/*.dhr; do
            echo "Compiling: $f"
            java -jar "$JAR" --compile-evm --output=build/evm "$f" || true
          done
          echo ""
          echo "═══ Compiled Artifacts ═══"
          ls -la build/evm/ 2>/dev/null || echo "No artifacts generated"

      - name: Upload EVM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evm-bytecode
          path: build/evm/
          retention-days: 30
